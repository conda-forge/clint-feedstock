{% set version = "0.5.1" %}

package:
  name: clint
  version: {{ version }}

source:
  fn: clint-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/c/clint/clint-{{ version }}.tar.gz
  md5: 8afd569f077886e2f4e6cca377da2623

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - args

  run:
    - python >={{ python_min }}
    - args

test:
  requires:
    - python {{ python_min }}
  imports:
    - clint
    - clint.packages
    - clint.packages.colorama
    - clint.textui

about:
  home: https://github.com/kennethreitz/clint
  license: ISC
  summary: 'Python Command Line Interface Tools'

extra:
  recipe-maintainers:
    - SylvainCorlay
